name: Build APK

on:
  push:
    # Docs and project notes do not change the app: skip the build (saves Actions minutes).
    paths-ignore:
      - '**.md'
      - '.coder/**'
  workflow_dispatch:

# Rapid consecutive commits (e.g. the agent fixing a build) only build the latest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Coder-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Coder-${{ github.run_number }}
          path: Coder-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Coder ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Otomatik derleme (${{ github.ref_name }} @ ${{ github.sha }}).
            Telefonda bu sayfadan APK dosyasına dokunup indirin ve kurun.
          files: Coder-${{ github.run_number }}.apk
