# Coder's own cold start on an emulator: without precompilation vs. with the baseline profile shipped in the APK.
# Manual only (Actions > Coder Perf > Run workflow): about 20 minutes of runner time per run.
name: Coder Perf

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Emülatör API seviyesi
        required: false
        default: "33"

permissions:
  contents: read

concurrency:
  group: coder-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK'lar (uygulama + ölçüm)
        run: ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark --no-daemon

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest --no-daemon

      - name: Özet
        if: always()
        run: |
          mkdir -p perf-out
          find macrobenchmark/build -name '*benchmarkData.json' -exec cp {} perf-out/ \; || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          rows = {}
          for f in glob.glob("perf-out/*benchmarkData.json"):
              for b in json.load(open(f)).get("benchmarks", []):
                  m = b.get("metrics", {}).get("timeToInitialDisplayMs")
                  if m: rows[b["name"]] = m
          print("## Coder soğuk açılış (emülatör, ms)\n")
          if not rows:
              print("Ölçüm sonucu yok; testin günlüğüne bakın.")
          else:
              print("| Ölçüm | Medyan | En az | En çok |\n|---|---|---|---|")
              for n, m in sorted(rows.items()):
                  print(f"| {n} | {m['median']:.0f} | {m['minimum']:.0f} | {m['maximum']:.0f} |")
              a, b = rows.get("startupWithoutProfile"), rows.get("startupWithBaselineProfile")
              if a and b:
                  print(f"\nBaseline profile kazancı (medyan): %{(a['median'] - b['median']) / a['median'] * 100:.1f}")
              print("\nEmülatör sayıları sürümleri karşılaştırmak içindir; gerçek telefondaki süre farklıdır.")
          PY
          cat "$GITHUB_STEP_SUMMARY" | tail -12

      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coder-perf
          if-no-files-found: warn
          retention-days: 14
          path: perf-out/
