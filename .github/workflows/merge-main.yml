name: Merge main into branch

on:
  push:
    branches: [feat/mimar-kilidi]
    paths:
      - .github/workflows/merge-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: feat/mimar-kilidi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mimar-kilidi
          fetch-depth: 0

      - name: Merge
        run: |
          set -e
          git config user.name coder-merge
          git config user.email coder@users.noreply.github.com
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then echo "zaten birleşik"; exit 0; fi
          set +e
          git merge --no-commit --no-ff origin/main > /tmp/merge.log 2>&1
          set -e
          tail -n 20 /tmp/merge.log || true
          git diff --name-only --diff-filter=U > /tmp/u.txt || true
          echo "---- çakışan dosyalar ----"
          cat /tmp/u.txt || true
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if git cat-file -e "origin/main:$p" 2>/dev/null; then
              git checkout origin/main -- "$p"
              git add "$p"
            else
              git rm -f "$p"
            fi
          done < /tmp/u.txt
          git commit -q -m "Merge main into feat/mimar-kilidi (çakışmalarda main sürümü)" || echo "commit yok"
          git push origin HEAD:$BRANCH

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Derleme kontrolü
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --console=plain
