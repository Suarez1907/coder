name: Kotlin diag

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diag.yml

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and collect errors
        run: |
          set +e
          ./gradlew :app:compileReleaseKotlin --no-daemon --console=plain > log.txt 2>&1
          echo "exit=$?" > errors.txt
          grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:" log.txt >> errors.txt
          echo "---- tail ----" >> errors.txt
          tail -c 8000 log.txt >> errors.txt
      - name: Publish errors to branch
        run: |
          git config user.name coder-bot
          git config user.email bot@example.com
          git checkout -B diag-log
          git add -f errors.txt
          git commit -m "diag: kotlin errors" || true
          git push -f origin diag-log
