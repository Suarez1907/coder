name: Branch merge helper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-cb1cf617-73w6ci
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into branch
        run: |
          set -eux
          git config user.name "coder-bot"
          git config user.email "coder-bot@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X theirs origin/main || true
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICTS" ]; then
            echo "$CONFLICTS" | xargs -r git checkout --theirs --
            git add -A
            git commit -m "Merge main into branch (conflicts resolved: main)"
          fi
          git push origin HEAD:ccr-cb1cf617-73w6ci
